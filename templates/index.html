<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Placement Prep Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="navbar-inner">
    <div class="nav-left">
      <h1 class="nav-logo">Prep<span class="nav-logo-dim">Tracker</span></h1>
    </div>
    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-page="dashboard">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
        Dashboard
      </button>
      <!-- subject tabs injected by JS -->
    </div>
  </div>
</nav>

<div class="app">
  <!-- ── Dashboard page ───────────────────────────────────────── -->
  <div class="page" id="page-dashboard">
    <div class="dash-top">
      <div class="dash-donut-card card" id="dashDonut"></div>
      <div class="dash-rank-card card" id="dashRank"></div>
    </div>
    <div class="dash-heatmap-card card">
      <div class="hm-header" id="hmHeader"></div>
      <div id="dashHeatmap" class="heatmap-wrap"></div>
      <div class="hm-tooltip" id="hmTooltip"></div>
    </div>
  </div>

  <!-- ── Subject page (cloned per subject, starts hidden) ─────── -->
  <div class="page hidden" id="page-subject">
    <div class="subject-header">
      <h2 class="section-title" id="subjectTitle">DSA</h2>
      <div class="subject-actions">
        <button class="btn-primary btn-folder" id="btnFolder">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="none"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3.586a1 1 0 0 1 .707.293L9.5 5H14.5A1.5 1.5 0 0 1 16 6.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 2 13.5z" stroke="currentColor" stroke-width="1.3"/><path d="M7 9.5h4M9 7.5v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          New Topic
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters" id="subjectFilters">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" class="search-input" placeholder="Search questions..." id="searchInput">
      </div>
      <div class="custom-select" id="filterDiff">
        <button class="cs-trigger" type="button">
          <span class="cs-label">All Levels</span>
          <svg class="cs-chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3.5 3-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <div class="cs-dropdown" id="filterDiffDropdown"></div>
      </div>
    </div>

    <!-- Folder tree -->
    <div class="tree-container" id="treeContainer"></div>
  </div>
</div>

<!-- ── Add/Edit Modal ─────────────────────────────────────────── -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <h2 class="modal-title" id="modalTitle">Add Question</h2>
    <form id="qForm" onsubmit="return false;">
      <div class="form-row">
        <div class="form-group full">
          <label for="fTitle">Title</label>
          <input type="text" id="fTitle" required placeholder="Two Sum">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="fLink">Problem Link</label>
          <input type="url" id="fLink" placeholder="https://leetcode.com/problems/...">
        </div>
        <div class="form-group">
          <label for="fVideoLink">Reference Material</label>
          <input type="url" id="fVideoLink" placeholder="https://youtube.com/watch?v=...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Difficulty</label>
          <div class="segmented" id="segDifficulty"></div>
          <input type="hidden" id="fDifficulty" value="medium">
        </div>
        <div class="form-group">
          <label for="fTopic">Topic</label>
          <input type="text" id="fTopic" list="topicList" placeholder="e.g. Array" autocomplete="off">
          <datalist id="topicList"></datalist>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Date Solved</label>
          <div class="date-picker" id="datePicker">
            <button class="dp-trigger" type="button" id="dpTrigger">
              <svg class="dp-icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
                <rect x="1.5" y="2.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/>
                <path d="M1.5 6h13" stroke="currentColor" stroke-width="1.2"/>
                <path d="M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <span class="dp-label" id="dpLabel"></span>
              <svg class="dp-chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3.5 3-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </button>
            <div class="dp-dropdown" id="dpDropdown">
              <div class="dp-nav">
                <button type="button" class="dp-nav-btn" id="dpPrev">
                  <svg width="12" height="12" viewBox="0 0 12 12"><path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
                <span class="dp-month-label" id="dpMonthLabel"></span>
                <button type="button" class="dp-nav-btn" id="dpNext">
                  <svg width="12" height="12" viewBox="0 0 12 12"><path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </button>
              </div>
              <div class="dp-weekdays">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
              </div>
              <div class="dp-grid" id="dpGrid"></div>
            </div>
          </div>
          <input type="hidden" id="fDate">
        </div>
        <div class="form-group">
          <label>Status</label>
          <div class="custom-select" id="fStatusSelect" data-value="solved">
            <button class="cs-trigger" type="button">
              <span class="cs-dot" style="background:var(--green)"></span>
              <span class="cs-label">Solved</span>
              <svg class="cs-chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3.5 3-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </button>
            <div class="cs-dropdown">
              <div class="cs-option selected" data-value="solved"><span class="cs-dot" style="background:var(--green)"></span>Solved</div>
              <div class="cs-option" data-value="revisit"><span class="cs-dot" style="background:var(--orange)"></span>Revisit</div>
              <div class="cs-option" data-value="todo"><span class="cs-dot" style="background:var(--text-3)"></span>Todo</div>
            </div>
          </div>
          <input type="hidden" id="fStatus" value="solved">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label for="fNotes">Notes</label>
          <textarea id="fNotes" rows="3" placeholder="Approach, key insights, time complexity..."></textarea>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label for="fCode">Code (C++)</label>
          <textarea id="fCode" rows="8" class="code-input" placeholder="Paste your C++ solution here..." spellcheck="false"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary" id="btnSave">Save Question</button>
      </div>
    </form>
  </div>
</div>

<div class="notes-popover" id="notesPopover">
  <div class="notes-popover-content" id="notesPopoverContent"></div>
</div>

<div class="toast" id="toast"></div>
<div class="xp-popup" id="xpPopup"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
